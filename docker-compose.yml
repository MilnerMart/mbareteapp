# Produccion: frontend -> backend. Las imagenes van a S3.
# Entrada publica: Caddy (80/443, HTTPS solo) con COMPOSE_PROFILES=caddy en el .env de la raiz, o el nginx que ya tenga
# el servidor apuntando al frontend publicado en FRONTEND_PUBLISH (por defecto 127.0.0.1:8280, solo local).
# La base de datos es externa: RDS, u otro contenedor del mismo servidor (DB_HOST=host.docker.internal).
# Las variables de cada app estan en deploy/env/*.env (no se suben al repositorio).
x-php-app: &php-app
  restart: unless-stopped
  # permite llegar a servicios del propio servidor, ej. un MySQL en otro contenedor con el puerto publicado
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    PHP_OPCACHE_ENABLE: "1"
    PHP_FPM_PM_CONTROL: ondemand
    PHP_FPM_PM_MAX_CHILDREN: "6"
    # al arrancar cachea config, rutas y vistas; las migraciones las corre deploy.sh
    AUTORUN_ENABLED: "true"
    AUTORUN_LARAVEL_MIGRATION: "false"
    AUTORUN_LARAVEL_STORAGE_LINK: "false"

services:
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

  frontend:
    <<: *php-app
    build: ./frontend
    image: mbarete-frontend:latest
    env_file: ./deploy/env/frontend.env
    ports:
      - "${FRONTEND_PUBLISH:-127.0.0.1:8280}:8080"
    volumes:
      - frontend-logs:/var/www/html/storage/logs
    depends_on:
      - backend

  backend:
    <<: *php-app
    build: ./backend
    image: mbarete-backend:latest
    env_file: ./deploy/env/backend.env
    volumes:
      # imagenes del almacenamiento local (hasta pasar a S3) y archivos/logs de Laravel
      - backend-images:/var/www/html/public/images
      - backend-storage:/var/www/html/storage/app
      - backend-logs:/var/www/html/storage/logs

  # tareas programadas: misma imagen y variables que el backend, pero en vez de atender la API corre el scheduler.
  # Uno solo: si hubiera dos, cada regla correria dos veces. No publica puertos ni lo usa el frontend.
  scheduler:
    restart: unless-stopped
    image: mbarete-backend:latest
    env_file: ./deploy/env/backend.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHP_OPCACHE_ENABLE: "1"
      AUTORUN_ENABLED: "false"
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    volumes:
      - backend-storage:/var/www/html/storage/app
      - backend-logs:/var/www/html/storage/logs
    depends_on:
      - backend

volumes:
  caddy-data:
  caddy-config:
  frontend-logs:
  backend-images:
  backend-storage:
  backend-logs:
